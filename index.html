<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevTask - Project Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">D</div>
            <span>DevTask</span>
        </div>

        <nav>
            <a href="#" class="nav-item active">
                <span>📊</span>
                Dashboard
            </a>

            <a href="#projects" class="nav-item">
                <span>📁</span>
                Projects
            </a>

            <a href="#tasks" class="nav-item">
                <span>✓</span>
                Tasks
            </a>

            <a href="#team" class="nav-item">
                <span>👥</span>
                Team
            </a>
        </nav>

        <div class="sidebar-bottom">
            <button id="themeToggle">
                🌙 Dark Mode
            </button>
        </div>

    </aside>


    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Dashboard</h1>
                <p>Manage your development projects.</p>
            </div>

            <div class="header-actions">

                <button class="notification">
                    🔔
                    <span class="notification-dot"></span>
                </button>

                <div class="profile">
                    <div class="avatar">MR</div>

                    <div>
                        <strong>Mohan Raju</strong>
                        <small>Developer</small>
                    </div>
                </div>

            </div>

        </header>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <div class="stat-icon blue">📁</div>

                <div>
                    <p>Total Projects</p>
                    <h2 id="totalProjects">0</h2>
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-icon orange">⚡</div>

                <div>
                    <p>In Progress</p>
                    <h2 id="activeProjects">0</h2>
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-icon green">✓</div>

                <div>
                    <p>Completed</p>
                    <h2 id="completedProjects">0</h2>
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-icon purple">📝</div>

                <div>
                    <p>Total Tasks</p>
                    <h2 id="totalTasks">0</h2>
                </div>
            </div>

        </section>


        <!-- Projects Section -->
        <section class="content-section" id="projects">

            <div class="section-header">

                <div>
                    <h2>Projects</h2>
                    <p>Your current development projects</p>
                </div>

                <button class="primary-btn" id="addProjectBtn">
                    + New Project
                </button>

            </div>


            <!-- Search / Filter -->
            <div class="toolbar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search projects..."
                >

                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="planning">Planning</option>
                    <option value="progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>

            </div>


            <div class="projects-grid" id="projectsGrid">
                <!-- Projects generated by JS -->
            </div>

        </section>


        <!-- Tasks -->
        <section class="content-section" id="tasks">

            <div class="section-header">

                <div>
                    <h2>Recent Tasks</h2>
                    <p>Track your development work</p>
                </div>

                <button class="secondary-btn" id="addTaskBtn">
                    + Add Task
                </button>

            </div>

            <div class="task-list" id="taskList">
                <!-- Tasks generated by JS -->
            </div>

        </section>

    </main>


    <!-- Add Project Modal -->
    <div class="modal hidden" id="projectModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Create Project</h2>

                <button id="closeProjectModal">
                    ✕
                </button>

            </div>


            <form id="projectForm">

                <label>
                    Project Name
                    <input
                        type="text"
                        id="projectName"
                        required
                        placeholder="e.g. Resume Builder"
                    >
                </label>


                <label>
                    Description
                    <textarea
                        id="projectDescription"
                        required
                        placeholder="Describe your project..."
                    ></textarea>
                </label>


                <label>
                    Status

                    <select id="projectStatus">

                        <option value="planning">
                            Planning
                        </option>

                        <option value="progress">
                            In Progress
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </label>


                <label>
                    Progress

                    <input
                        type="range"
                        id="projectProgress"
                        min="0"
                        max="100"
                        value="0"
                    >

                    <span id="progressValue">0%</span>

                </label>


                <div class="form-actions">

                    <button
                        type="button"
                        class="secondary-btn"
                        id="cancelProject"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Create Project
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
